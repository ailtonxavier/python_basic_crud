services:


  backend:
    build: ./backend
    container_name: python
    restart: unless-stopped
    env_file:
      - .env.app
    ports:
      - "8000:8000"
    depends_on:
      - database
    volumes:
      - ./backend:/app
    tty: true
    stdin_open: true
  

  database:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    env_file:
      - .env.db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: